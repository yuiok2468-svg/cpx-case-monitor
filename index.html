<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>CPX 상황지침 모니터</title>
<style>
  :root{
    --paper:#ffffff;
    --ink:#111111;
    --line:#111111;
    --muted:#5a5a5a;
    --panel:#f4f4f2;
    --accent:#8b1d1d; /* deep clinical red, used sparingly for timer warning */
    --accent-soft:#f2e4e4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    background:var(--panel);
    color:var(--ink);
    min-height:100vh;
  }
  .app{
    max-width:960px;
    margin:0 auto;
    padding:20px 16px 60px;
  }
  .tabs{
    display:flex;
    gap:8px;
    margin-bottom:18px;
  }
  .tab{
    flex:1;
    padding:11px 0;
    text-align:center;
    background:var(--paper);
    border:2px solid var(--line);
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    letter-spacing:.5px;
  }
  .tab.active{
    background:var(--ink);
    color:#fff;
  }
  .view{display:none;}
  .view.active{display:block;}

  /* ---------- 입력 화면 ---------- */
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  @media (max-width:640px){ .grid{grid-template-columns:1fr;} }

  .card{
    background:var(--paper);
    border:1px solid #d7d5d0;
    border-radius:2px;
    padding:16px 18px;
  }
  .card h3{
    margin:0 0 12px;
    font-size:13px;
    letter-spacing:1px;
    color:var(--muted);
    text-transform:uppercase;
    border-bottom:2px solid var(--ink);
    padding-bottom:8px;
  }
  label{
    display:block;
    font-size:12.5px;
    color:var(--muted);
    margin:10px 0 4px;
  }
  label:first-of-type{margin-top:0;}
  input[type=text],input[type=number],select,textarea{
    width:100%;
    padding:8px 9px;
    border:1px solid #b9b7b2;
    border-radius:2px;
    font-size:14px;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
  }
  textarea{resize:vertical;min-height:78px;line-height:1.5;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .vitals-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

  .btnbar{
    display:flex;
    gap:8px;
    margin-top:16px;
  }
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:2px;
  }
  .btn-primary{
    background:var(--ink);
    color:#fff;
    padding:10px 16px;
    font-size:14px;
    font-weight:700;
    flex:1;
  }
  .btn-primary:hover{background:#000;}
  .btn-secondary{
    background:transparent;
    color:var(--ink);
    border:1px solid #b9b7b2;
    padding:10px 14px;
    font-size:13px;
  }
  .btn-secondary:hover{background:#eee;}

  .library{margin-top:16px;}
  .lib-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 12px;
    background:var(--paper);
    border:1px solid #d7d5d0;
    border-left:4px solid var(--ink);
    margin-bottom:8px;
    font-size:13.5px;
  }
  .lib-item .meta{color:var(--muted);font-size:12px;margin-top:2px;}
  .lib-actions{display:flex;gap:6px;}
  .lib-actions button{
    font-size:12px;
    padding:6px 10px;
    background:#fff;
    border:1px solid #b9b7b2;
  }
  .lib-actions .danger{color:var(--accent);border-color:var(--accent);}
  .empty-hint{
    color:var(--muted);
    font-size:13px;
    padding:14px;
    text-align:center;
    border:1px dashed #c8c6c0;
  }

  /* ---------- 모니터 화면 ---------- */
  .monitor-wrap{
    background:var(--paper);
    padding:36px 40px 44px;
  }
  .picker-bar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .picker-bar select{flex:1;min-width:180px;}

  .timerbox{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-bottom:22px;
    padding:14px;
    background:var(--ink);
  }
  .timer-display{
    font-size:44px;
    font-weight:700;
    color:#fff;
    font-variant-numeric:tabular-nums;
    letter-spacing:2px;
    min-width:150px;
    text-align:center;
  }
  .timer-display.warn{color:#e8a5a5;}
  .timer-display.danger{color:#ff6b6b;}
  .timer-btn{
    background:#fff;
    color:var(--ink);
    padding:9px 16px;
    font-size:13px;
    font-weight:700;
  }
  .timer-btn:hover{background:#ddd;}

  .exam-card{
    border:3px solid var(--line);
  }
  .exam-title{
    text-align:center;
    font-weight:800;
    font-size:19px;
    padding:14px 0;
    border-bottom:3px solid var(--line);
    letter-spacing:1px;
  }
  .exam-header{
    display:flex;
    background:var(--ink);
    color:#fff;
    border-bottom:3px solid var(--line);
  }
  .exam-header .h-cell{
    flex:1;
    text-align:center;
    padding:14px 0;
    font-size:20px;
    font-weight:800;
  }
  .exam-header .h-cell + .h-cell{
    border-left:2px solid #fff;
  }
  .exam-body{padding:26px 30px 30px;}
  .patient-line{
    font-size:19px;
    font-weight:700;
    text-decoration:underline;
    line-height:1.7;
    margin-bottom:20px;
  }
  .vital-box{
    border:2px solid var(--line);
    padding:16px 24px;
    max-width:420px;
    margin:0 auto 24px;
  }
  .vital-box .vt-title{
    text-align:center;
    font-weight:800;
    font-size:16px;
    margin-bottom:10px;
  }
  .vital-box ul{
    list-style:none;
    margin:0;
    padding:0;
    font-size:16.5px;
    line-height:2.1;
  }
  .vital-box li:before{content:"● ";}
  .instructions p{
    font-weight:700;
    font-size:16.5px;
    margin:0 0 8px;
  }
  .instructions ul{
    margin:0;
    padding-left:2px;
    list-style:none;
    font-size:16px;
    line-height:1.9;
  }
  .instructions li:before{content:"- ";}

  .fullscreen-btn{
    display:block;
    width:100%;
    margin-top:18px;
    padding:11px;
    background:transparent;
    border:1px solid #b9b7b2;
    font-size:13px;
    color:var(--muted);
  }
  .fullscreen-btn:hover{background:#eee;}

  body.fs-active .app > .tabs,
  body.fs-active .app > .view > .picker-bar,
  body.fs-active .fullscreen-btn{display:none;}
  body.fs-active .app{max-width:none;padding:24px;}
  body.fs-active .monitor-wrap{max-width:900px;margin:0 auto;}
  body.fs-active .exam-title{font-size:26px;}
  body.fs-active .exam-header .h-cell{font-size:26px;padding:18px 0;}
  body.fs-active .patient-line{font-size:24px;}
  body.fs-active .vital-box{max-width:520px;}
  body.fs-active .vital-box ul{font-size:20px;}
  body.fs-active .instructions p,body.fs-active .instructions ul{font-size:19px;}
  body.fs-active .timer-display{font-size:60px;}

  .draw-group{
    background:var(--paper);
    border:1px solid #d7d5d0;
    border-left:6px solid var(--group-color, var(--ink));
    padding:10px 14px;
    margin-bottom:8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .draw-group .g-name{font-size:12px;color:var(--muted);}
  .draw-group .g-item{font-size:16px;font-weight:700;margin-top:2px;}
  .draw-group .g-page{font-size:12.5px;color:var(--muted);}
  .draw-summary{
    font-size:13px;
    color:var(--muted);
    margin:4px 0 12px;
  }
  .draw-history{margin-top:22px;}
  .hist-entry{
    font-size:12.5px;
    color:var(--muted);
    padding:8px 10px;
    border-bottom:1px solid #e5e3de;
  }

  .toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:3px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="app">
  <div class="tabs">
    <div class="tab" data-tab="draw">오늘의 문항 뽑기</div>
    <div class="tab active" data-tab="edit">입력 / 케이스 관리</div>
    <div class="tab" data-tab="monitor">모니터 표시</div>
  </div>

  <!-- ===== 주제 뽑기 화면 ===== -->
  <div class="view" id="view-draw">
    <div class="card" style="margin-bottom:14px;">
      <h3>뽑기 모드</h3>
      <div class="row2" style="margin-bottom:10px;">
        <label style="display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink);margin:0;">
          <input type="radio" name="draw-mode" value="standard" checked style="width:auto;"> 표준 모드 (총 9개 — 색깔별 1개씩, 마이너만 2개)
        </label>
        <label style="display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink);margin:0;">
          <input type="radio" name="draw-mode" value="variant" style="width:auto;"> 드문 변형 (총 9개 — 소화기/순환기/호흡기 중 한 카테고리에서 2개, 마이너는 1개, 나머지는 동일하게 각 1개)
        </label>
      </div>
      <label style="display:flex;align-items:center;gap:6px;margin-top:4px;">
        <input type="checkbox" id="draw-exclude-last" checked style="width:auto;"> 직전 회차에 나온 항목은 이번엔 제외하기
      </label>
      <div class="btnbar">
        <button class="btn-primary" id="btn-draw">뽑기</button>
        <button class="btn-secondary" id="btn-drawHistory">히스토리 초기화</button>
      </div>
    </div>

    <div id="draw-result"></div>
  </div>

  <!-- ===== 입력 화면 ===== -->
  <div class="view active" id="view-edit">
    <div class="grid">
      <div class="card">
        <h3>환자 기본 정보</h3>
        <label>케이스 이름 (구분용, 예: 급성흉통_남45세)</label>
        <input type="text" id="f-caseName" placeholder="예: 급성흉통_남45세">

        <div class="row3">
          <div>
            <label>나이</label>
            <input type="text" id="f-age" placeholder="예: 55">
          </div>
          <div>
            <label>성별</label>
            <select id="f-sex">
              <option value="남">남</option>
              <option value="여">여</option>
            </select>
          </div>
          <div>
            <label>이름</label>
            <input type="text" id="f-name" placeholder="예: OOO">
          </div>
        </div>

        <label>내원 장소</label>
        <select id="f-place">
          <option value="병원">병원</option>
          <option value="외래">외래</option>
          <option value="응급실">응급실</option>
        </select>

        <label>제한시간 (분)</label>
        <input type="number" id="f-time" value="12" min="1" max="60">
      </div>

      <div class="card">
        <h3>활력징후</h3>
        <div class="vitals-grid">
          <div>
            <label>혈압 (수축기/이완기, mmHg)</label>
            <div class="row2">
              <input type="text" id="f-sbp" placeholder="예: 120">
              <input type="text" id="f-dbp" placeholder="예: 80">
            </div>
          </div>
          <div>
            <label>맥박수 (회/분)</label>
            <input type="text" id="f-hr" placeholder="예: 78">
          </div>
          <div>
            <label>호흡수 (회/분)</label>
            <input type="text" id="f-rr" placeholder="예: 18">
          </div>
          <div>
            <label>체온 (℃)</label>
            <input type="text" id="f-temp" placeholder="예: 36.5">
          </div>
        </div>

        <label>응시자 지시사항 (한 줄에 하나씩)</label>
        <textarea id="f-instructions">증상과 관련한 병력을 청취하고,
증상과 관련한 신체진찰을 시행하고,
추정진단과 향후 계획을 환자와 논의하시오.</textarea>
      </div>
    </div>

    <div class="btnbar">
      <button class="btn-primary" id="btn-save">이 케이스 저장</button>
      <button class="btn-secondary" id="btn-clear">입력창 초기화</button>
    </div>

    <div class="library">
      <h3 style="border-bottom:2px solid var(--ink);padding-bottom:8px;font-size:13px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;">저장된 케이스</h3>
      <div id="lib-list"></div>
    </div>
  </div>

  <!-- ===== 모니터 화면 ===== -->
  <div class="view" id="view-monitor">
    <div class="picker-bar">
      <select id="m-picker"></select>
      <button class="btn-secondary" id="btn-loadCurrent">입력창 내용 바로 표시</button>
    </div>

    <div class="monitor-wrap">
      <div class="timerbox">
        <button class="timer-btn" id="t-start">시작</button>
        <div class="timer-display" id="t-display">12:00</div>
        <button class="timer-btn" id="t-reset">리셋</button>
      </div>

      <div class="exam-card">
        <div class="exam-title" id="m-title">[종합문항(임상표현) 예시문항]</div>
        <div class="exam-header">
          <div class="h-cell">문제</div>
          <div class="h-cell" id="m-timeLabel">제한시간 12분</div>
        </div>
        <div class="exam-body">
          <div class="patient-line" id="m-patientLine">○○세 여/남자 ○○○ 씨가<br>병원/외래/응급실에 왔다.</div>

          <div class="vital-box">
            <div class="vt-title">[활력징후]</div>
            <ul id="m-vitals">
              <li>혈&nbsp;&nbsp;&nbsp;압 : ○○○/○○ mmHg</li>
              <li>맥박수 : ○○ 회/분</li>
              <li>호흡수 : ○○ 회/분</li>
              <li>체&nbsp;&nbsp;&nbsp;온 : ○○ ℃</li>
            </ul>
          </div>

          <div class="instructions">
            <p>응시자는 이 환자에게</p>
            <ul id="m-instructions">
              <li>증상과 관련한 병력을 청취하고,</li>
              <li>증상과 관련한 신체진찰을 시행하고,</li>
              <li>추정진단과 향후 계획을 환자와 논의하시오.</li>
            </ul>
          </div>
        </div>
      </div>
      <button class="fullscreen-btn" id="btn-fullscreen">전체화면으로 모니터에 표시 (다시 누르면 해제)</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORE_KEY = 'cpx-cases';
let cases = [];
let currentTimerSeconds = 12*60;
let timerInterval = null;
let timerRunning = false;

function readForm(){
  return {
    id: Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    caseName: document.getElementById('f-caseName').value.trim() || '(이름 없는 케이스)',
    age: document.getElementById('f-age').value.trim() || '○○',
    sex: document.getElementById('f-sex').value,
    name: document.getElementById('f-name').value.trim() || '○○○',
    place: document.getElementById('f-place').value,
    time: document.getElementById('f-time').value.trim() || '12',
    sbp: document.getElementById('f-sbp').value.trim() || '○○○',
    dbp: document.getElementById('f-dbp').value.trim() || '○○',
    hr: document.getElementById('f-hr').value.trim() || '○○',
    rr: document.getElementById('f-rr').value.trim() || '○○',
    temp: document.getElementById('f-temp').value.trim() || '○○',
    instructions: document.getElementById('f-instructions').value.split('\n').map(s=>s.trim()).filter(Boolean)
  };
}

function fillFormFrom(c){
  document.getElementById('f-caseName').value = c.caseName === '(이름 없는 케이스)' ? '' : c.caseName;
  document.getElementById('f-age').value = c.age;
  document.getElementById('f-sex').value = c.sex;
  document.getElementById('f-name').value = c.name;
  document.getElementById('f-place').value = c.place;
  document.getElementById('f-time').value = c.time;
  document.getElementById('f-sbp').value = c.sbp;
  document.getElementById('f-dbp').value = c.dbp;
  document.getElementById('f-hr').value = c.hr;
  document.getElementById('f-rr').value = c.rr;
  document.getElementById('f-temp').value = c.temp;
  document.getElementById('f-instructions').value = c.instructions.join('\n');
}

function clearForm(){
  ['f-caseName','f-age','f-name','f-sbp','f-dbp','f-hr','f-rr','f-temp'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-sex').value='남';
  document.getElementById('f-place').value='병원';
  document.getElementById('f-time').value='12';
  document.getElementById('f-instructions').value = '증상과 관련한 병력을 청취하고,\n증상과 관련한 신체진찰을 시행하고,\n추정진단과 향후 계획을 환자와 논의하시오.';
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

async function loadCases(){
  try{
    const res = await window.storage.get(STORE_KEY, false);
    cases = res ? JSON.parse(res.value) : [];
  }catch(e){
    cases = [];
  }
  renderLibrary();
  renderPicker();
}

async function persistCases(){
  try{
    await window.storage.set(STORE_KEY, JSON.stringify(cases), false);
  }catch(e){
    showToast('저장 중 오류가 발생했어요');
  }
}

function renderLibrary(){
  const el = document.getElementById('lib-list');
  if(cases.length === 0){
    el.innerHTML = '<div class="empty-hint">아직 저장된 케이스가 없습니다. 위에서 정보를 입력하고 "이 케이스 저장"을 눌러주세요.</div>';
    return;
  }
  el.innerHTML = '';
  cases.forEach(c=>{
    const div = document.createElement('div');
    div.className = 'lib-item';
    div.innerHTML = `
      <div>
        <div>${c.caseName}</div>
        <div class="meta">${c.age}세 ${c.sex} · ${c.place} · 제한시간 ${c.time}분</div>
      </div>
      <div class="lib-actions">
        <button data-act="load" data-id="${c.id}">불러오기</button>
        <button data-act="monitor" data-id="${c.id}">모니터로 보기</button>
        <button class="danger" data-act="del" data-id="${c.id}">삭제</button>
      </div>`;
    el.appendChild(div);
  });
}

function renderPicker(){
  const sel = document.getElementById('m-picker');
  sel.innerHTML = '<option value="">-- 저장된 케이스에서 선택 --</option>';
  cases.forEach(c=>{
    const opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = `${c.caseName} (${c.age}세 ${c.sex})`;
    sel.appendChild(opt);
  });
}

document.getElementById('lib-list').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  const id = btn.dataset.id;
  const c = cases.find(x=>x.id===id);
  if(!c) return;
  if(btn.dataset.act === 'load'){
    fillFormFrom(c);
    showToast('입력창에 불러왔습니다');
  } else if(btn.dataset.act === 'monitor'){
    displayCase(c);
    switchTab('monitor');
    document.getElementById('m-picker').value = c.id;
  } else if(btn.dataset.act === 'del'){
    if(confirm(`"${c.caseName}" 케이스를 삭제할까요?`)){
      cases = cases.filter(x=>x.id!==id);
      persistCases();
      renderLibrary();
      renderPicker();
    }
  }
});

document.getElementById('btn-save').addEventListener('click', async ()=>{
  const c = readForm();
  cases.push(c);
  await persistCases();
  renderLibrary();
  renderPicker();

function displayCase(c){
  document.getElementById('m-title').textContent = `[종합문항(임상표현) 예시문항]`;
  document.getElementById('m-timeLabel').textContent = `제한시간 ${c.time}분`;
  document.getElementById('m-patientLine').innerHTML = `${c.age}세 ${c.sex}자 ${c.name} 씨가<br>${c.place}에 왔다.`;
  document.getElementById('m-vitals').innerHTML = `
    <li>혈&nbsp;&nbsp;&nbsp;압 : ${c.sbp}/${c.dbp} mmHg</li>
    <li>맥박수 : ${c.hr} 회/분</li>
    <li>호흡수 : ${c.rr} 회/분</li>

}

// ---- 타이머 ----
function formatTime(s){
  const m = Math.floor(s/60).toString().padStart(2,'0');
  const sec = (s%60).toString().padStart(2,'0');
  return `${m}:${sec}`;
}
function renderTimer(){
  const disp = document.getElementById('t-display');
  disp.textContent = formatTime(Math.max(currentTimerSeconds,0));
  disp.classList.remove('warn','danger');
  if(currentTimerSeconds <= 60) disp.classList.add('danger');
  else if(currentTimerSeconds <= 180) disp.classList.add('warn');
}
function resetTimer(minutes){
  clearInterval(timerInterval);
  timerRunning = false;
  document.getElementById('t-start').textContent = '시작';
  currentTimerSeconds = (minutes||12)*60;
  renderTimer();
}
document.getElementById('t-start').addEventListener('click', ()=>{
  if(timerRunning){
    clearInterval(timerInterval);
    timerRunning = false;
    document.getElementById('t-start').textContent = '시작';
  } else {
    timerRunning = true;
    document.getElementById('t-start').textContent = '일시정지';
    timerInterval = setInterval(()=>{
      currentTimerSeconds--;
      renderTimer();
      if(currentTimerSeconds <= 0){
        clearInterval(timerInterval);
        timerRunning = false;
        document.getElementById('t-start').textContent = '시작';
      }
    },1000);
  }
});
document.getElementById('t-reset').addEventListener('click', ()=>{
  const timeInput = parseInt(document.getElementById('f-time').value,10) || 12;
  resetTimer(timeInput);
});

function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function pickFrom(catKey, count, excludeNames){
  const pool = CATEGORIES[catKey].items.filter(it => !excludeNames.has(it.name));
  const usable = pool.length >= count ? pool : CATEGORIES[catKey].items; // 제외하면 부족하면 전체 풀 사용
  return shuffled(usable).slice(0,count).map(it => ({...it, cat:catKey}));
}

async function loadDrawHistory(){
  try{
    const res = await window.storage.get(DRAW_HISTORY_KEY, false);
    drawHistory = res ? JSON.parse(res.value) : [];
  }catch(e){ drawHistory = []; }
  renderDrawHistory();
}
async function persistDrawHistory(){
  try{ await window.storage.set(DRAW_HISTORY_KEY, JSON.stringify(drawHistory), false); }
  catch(e){ showToast('히스토리 저장 중 오류'); }
}

function doDraw(){
  const mode = document.querySelector('input[name="draw-mode"]:checked').value;
  const excludeLast = document.getElementById('draw-exclude-last').checked;
  const lastNames = new Set(excludeLast && drawHistory.length ? drawHistory[0].items.map(i=>i.name) : []);

  let result = [];
  if(mode === 'standard'){
    result.push(...pickFrom('소화기',1,lastNames));
    result.push(...pickFrom('순환기',1,lastNames));
    result.push(...pickFrom('호흡기',1,lastNames));
    result.push(...pickFrom('마이너',2,lastNames));
    result.push(...pickFrom('정신신경',1,lastNames));
    result.push(...pickFrom('정신',1,lastNames));
    result.push(...pickFrom('산부여성',1,lastNames));
    result.push(...pickFrom('상담',1,lastNames));
  } else {
    const boosted = shuffled(['소화기','순환기','호흡기'])[0];
    ['소화기','순환기','호흡기'].forEach(cat=>{
      result.push(...pickFrom(cat, cat===boosted ? 2 : 1, lastNames));
    });
    result.push(...pickFrom('마이너',1,lastNames));
    result.push(...pickFrom('정신신경',1,lastNames));
    result.push(...pickFrom('정신',1,lastNames));
    result.push(...pickFrom('산부여성',1,lastNames));
    result.push(...pickFrom('상담',1,lastNames));
  }

  renderDrawResult(result, mode);
  drawHistory.unshift({ time: new Date().toLocaleString('ko-KR'), mode, items: result });
  drawHistory = drawHistory.slice(0,20);
  persistDrawHistory();
  renderDrawHistory();
}

function renderDrawResult(result, mode){
  const el = document.getElementById('draw-result');
  const modeLabel = mode==='standard' ? '표준 모드 · 총 '+result.length+'개' : '드문 변형 · 총 '+result.length+'개';
  let html = `<div class="draw-summary">${modeLabel}</div>`;
  result.forEach(it=>{
    html += `<div class="draw-group" style="--group-color:${CATEGORIES[it.cat].color}">
      <div>
        <div class="g-name">${CATEGORIES[it.cat].label}</div>
        <div class="g-item">${it.name}</div>
      </div>
      <div class="g-page">p.${it.page}</div>
    </div>`;
  });
  el.innerHTML = html;
}

function renderDrawHistory(){
  let el = document.getElementById('draw-history-list');
  if(!el){
    const wrap = document.createElement('div');
    wrap.className = 'draw-history';
    wrap.innerHTML = '<h3 style="border-bottom:2px solid var(--ink);padding-bottom:8px;font-size:13px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;">최근 히스토리</h3><div id="draw-history-list"></div>';
    document.getElementById('view-draw').appendChild(wrap);
    el = document.getElementById('draw-history-list');
  }
  if(drawHistory.length === 0){
    el.innerHTML = '<div class="empty-hint">아직 뽑은 기록이 없습니다.</div>';
    return;
  }
  el.innerHTML = drawHistory.map(h=>{
    const names = h.items.map(i=>i.name).join(', ');
    return `<div class="hist-entry"><strong>${h.time}</strong> — ${names}</div>`;
  }).join('');
}

document.getElementById('btn-draw').addEventListener('click', doDraw);

    drawHistory = [];
    persistDrawHistory();
    renderDrawHistory();

});
